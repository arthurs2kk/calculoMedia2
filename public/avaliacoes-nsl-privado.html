<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Avaliações | Calculadora NSL</title>
    <link rel="icon" type="image/png" href="logo_lourdinasTransparente.png">
    <script src="theme.js"></script>
    <style>
        * { box-sizing: border-box; }
        :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
        body { min-height: 100vh; margin: 0; padding: 28px; color: #edf8ff; background: #071523; }
        main { width: min(980px, 100%); margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.6rem); letter-spacing: -0.04em; }
        header p { margin: 6px 0 0; color: #9bb1c2; }
        button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; color: white; background: linear-gradient(135deg, #0b5f98, #079bd7); cursor: pointer; font-weight: 800; }
        .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
        .summary article, .feedback-item { border: 1px solid rgba(127, 209, 242, 0.16); border-radius: 17px; background: #0f2638; }
        .summary article { padding: 18px; }
        .summary strong { display: block; font-size: 1.8rem; }
        .summary span { color: #9bb1c2; font-size: 0.82rem; }
        .feedback-list { display: grid; gap: 10px; }
        .feedback-item { padding: 16px; }
        .feedback-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: #8fa9ba; font-size: 0.76rem; }
        .stars { color: #ffc548; letter-spacing: 0.08em; }
        .feedback-item p { margin: 12px 0 0; white-space: pre-wrap; }
        .empty, .error { padding: 28px; border: 1px dashed rgba(127, 209, 242, 0.25); border-radius: 17px; color: #9bb1c2; text-align: center; }
        html[data-theme="light"] body { color: #0a2d4d; background: #edf6fb; }
        html[data-theme="light"] header p, html[data-theme="light"] .summary span, html[data-theme="light"] .feedback-meta { color: #607487; }
        html[data-theme="light"] .summary article, html[data-theme="light"] .feedback-item { border-color: #d5e6f1; background: white; }
        @media (max-width: 620px) { body { padding: 18px; } header { align-items: stretch; flex-direction: column; } .summary { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main>
        <header>
            <div><h1>Avaliações recebidas</h1><p>Página não vinculada à navegação pública.</p></div>
            <button id="download" type="button" disabled>Baixar avaliações.json</button>
        </header>
        <section class="summary" aria-label="Resumo">
            <article><strong id="count">—</strong><span>avaliações</span></article>
            <article><strong id="average">—</strong><span>média de 5</span></article>
        </section>
        <section class="feedback-list" id="feedback-list"><p class="empty">Carregando avaliações...</p></section>
    </main>
    <script>
        const list = document.getElementById('feedback-list');
        const count = document.getElementById('count');
        const average = document.getElementById('average');
        const download = document.getElementById('download');
        let records = [];

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);

        async function loadFeedback() {
            try {
                const response = await fetch('/api/feedback', { cache: 'no-store' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Falha ao carregar');
                records = result.feedback || [];
                count.textContent = records.length;
                average.textContent = records.length ? (records.reduce((sum, item) => sum + Number(item.rating), 0) / records.length).toFixed(1).replace('.', ',') : '—';
                download.disabled = records.length === 0;

                if (!records.length) {
                    list.innerHTML = '<p class="empty">Nenhuma avaliação recebida ainda.</p>';
                    return;
                }

                list.innerHTML = records.map((item) => `
                    <article class="feedback-item">
                        <div class="feedback-meta">
                            <span class="stars">${'★'.repeat(Number(item.rating))}${'☆'.repeat(5 - Number(item.rating))}</span>
                            <span>${escapeHtml(new Date(item.createdAt).toLocaleString('pt-BR'))} · ${escapeHtml(item.page)}</span>
                        </div>
                        <p>${item.message ? escapeHtml(item.message) : '<em>Sem sugestão escrita.</em>'}</p>
                    </article>
                `).join('');
            } catch {
                list.innerHTML = '<p class="error">Não foi possível carregar as avaliações agora.</p>';
            }
        }

        download.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'avaliacoes.json';
            link.click();
            URL.revokeObjectURL(url);
        });

        loadFeedback();
    </script>
</body>
</html>
